<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1780" width="780" height="1780" role="img" aria-labelledby="title desc" lang="ru">
<title id="title">Как агент обосновывает рекомендацию</title>
<desc id="desc">Вымышленный учебный снимок paired-case-review. POLICY v2 поддерживает E9 и E10: ресурс разработчика отозван, бумажная подготовка допустима без кода. E4 и H2 устарели; неизвестные часы команды и гипотеза H1 не становятся фактами. Сравнение O0, O1, O2 и O3 приводит к записанной рекомендации O2; прежний выбор владельца O1 сохранён. При новых данных варианты сравниваются заново. Это карта сохранённых оснований и кратких объяснений, не скрытые рассуждения модели.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#008c46" stroke-width="2"/></marker></defs>
<rect width="780" height="1780" rx="28" fill="#f5f7f6"/>
<g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="21" fill="#008c46" font-weight="700" text-anchor="start">ВЫМЫШЛЕННЫЙ УЧЕБНЫЙ СНИМОК</text>
<text x="36" y="94" font-size="34" fill="#23282b" font-weight="700" text-anchor="start">Как обоснована рекомендация</text>
<path data-from="question" data-to="resource" d="M300 270 V304 H200 V344" fill="none" stroke="#008c46" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-from="question" data-to="paper" d="M480 270 V304 H580 V344" fill="none" stroke="#008c46" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-from="resource" data-to="stale" d="M200 530 V608" fill="none" stroke="#008c46" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-from="paper" data-to="unknown" d="M580 530 V608" fill="none" stroke="#731982" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<path data-from="resource" data-to="comparison" d="M36 437 H24 Q18 437 18 445 V904 Q18 912 26 912 H36" fill="none" stroke="#008c46" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-from="paper" data-to="comparison" d="M744 437 H754 Q762 437 762 445 V904 Q762 912 754 912 H744" fill="none" stroke="#008c46" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-from="comparison" data-to="recommendation" d="M200 1132 V1208" fill="none" stroke="#008c46" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-from="recommendation" data-to="owner" d="M364 1298 H416" fill="none" stroke="#008c46" stroke-width="2.5" marker-end="url(#arrow)"/>
<path data-from="recommendation" data-to="revisit" d="M200 1388 V1460" fill="none" stroke="#731982" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="200" y="575" font-size="23" fill="#731982" font-weight="400" text-anchor="middle">отзывает основание</text>
<text x="580" y="575" font-size="22" fill="#731982" font-weight="400" text-anchor="middle">не доказывает эффект</text>
<text x="200" y="1177" font-size="23" fill="#731982" font-weight="400" text-anchor="middle">обоснование</text>
<text x="580" y="1177" font-size="23" fill="#731982" font-weight="400" text-anchor="middle">запрос решения</text>
<text x="390" y="1433" font-size="23" fill="#731982" font-weight="400" text-anchor="middle">новые данные → повторное сравнение</text>
<g id="question"><rect x="126" y="140" width="528" height="130" rx="22" fill="#e6f6ed" stroke="#00ab55" stroke-width="2"/>
<text x="148" y="183" font-size="30" fill="#008c46" font-weight="700" text-anchor="start">Агент и вопрос решения · Q1</text>
<text x="148" y="225" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">Что выполнимо к сроку кейса?</text>
</g>
<g id="resource"><rect x="36" y="344" width="328" height="186" rx="22" fill="#fff" stroke="#d2e2d8" stroke-width="2"/>
<text x="58" y="387" font-size="28" fill="#008c46" font-weight="700" text-anchor="start">POLICY v2 → E9</text>
<text x="58" y="429" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">Нет разработчика</text>
<text x="58" y="465" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">и замены к сроку</text>
</g>
<g id="paper"><rect x="416" y="344" width="328" height="186" rx="22" fill="#fff" stroke="#d2e2d8" stroke-width="2"/>
<text x="438" y="387" font-size="28" fill="#008c46" font-weight="700" text-anchor="start">POLICY v2 → E10</text>
<text x="438" y="429" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">Бумажный план</text>
<text x="438" y="465" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">допустим без кода</text>
</g>
<g id="stale"><rect x="36" y="608" width="328" height="174" rx="22" fill="#f4eaf6" stroke="#d6b8dc" stroke-width="2"/>
<text x="58" y="651" font-size="28" fill="#731982" font-weight="700" text-anchor="start">E4 / H2 · устарело</text>
<text x="58" y="693" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">Прежнее условие v1</text>
<text x="58" y="729" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">больше не основание</text>
</g>
<g id="unknown"><rect x="416" y="608" width="328" height="174" rx="22" fill="#f4eaf6" stroke="#d6b8dc" stroke-width="2"/>
<text x="438" y="651" font-size="27" fill="#731982" font-weight="700" text-anchor="start">Что ещё неизвестно</text>
<text x="438" y="693" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">Часы команды · эффект</text>
<text x="438" y="729" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">H1: гипотеза, не спрос</text>
</g>
<text x="36" y="829" font-size="26" fill="#334b3d" font-weight="400" text-anchor="start">E11: задержка интеграции ≠ потеря разработчика.</text>
<g id="comparison"><rect x="36" y="864" width="708" height="268" rx="22" fill="#fff" stroke="#d2e2d8" stroke-width="2"/>
<text x="58" y="907" font-size="29" fill="#008c46" font-weight="700" text-anchor="start">Сравнение альтернатив по основаниям</text>
<text x="58" y="949" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">O0 · ручной чек-лист — если нет ресурса на O2</text>
<text x="58" y="985" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">O1 · прототип — нет разработчика к сроку</text>
<text x="58" y="1021" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">O2 · бумага — без кода; часы ещё уточнить</text>
<text x="58" y="1057" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">O3 · заморозить — если обучение не нужно</text>
<text x="58" y="1093" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">Бумага не проверяет реализацию и спрос.</text>
</g>
<g id="recommendation"><rect x="36" y="1208" width="328" height="180" rx="22" fill="#f4eaf6" stroke="#d6b8dc" stroke-width="2"/>
<text x="58" y="1251" font-size="27" fill="#731982" font-weight="700" text-anchor="start">Рекомендация: O2</text>
<text x="58" y="1293" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">E9 + E10: начать</text>
<text x="58" y="1329" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">с бумажного сценария</text>
</g>
<g id="owner"><rect x="416" y="1208" width="328" height="180" rx="22" fill="#731982" stroke="#731982" stroke-width="2"/>
<text x="438" y="1251" font-size="25" fill="#fff" font-weight="700" text-anchor="start">Выбор владельца: O1</text>
<text x="438" y="1293" font-size="27" fill="#fff" font-weight="400" text-anchor="start">Не заменён агентом</text>
<text x="438" y="1329" font-size="27" fill="#fff" font-weight="400" text-anchor="start">Ждёт ответа владельца</text>
</g>
<g id="revisit"><rect x="36" y="1460" width="708" height="170" rx="22" fill="#fff" stroke="#d2e2d8" stroke-width="2"/>
<text x="58" y="1503" font-size="29" fill="#008c46" font-weight="700" text-anchor="start">Что может изменить рекомендацию?</text>
<text x="58" y="1545" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">Появится ресурс на O1 → сравнить заново.</text>
<text x="58" y="1581" font-size="27" fill="#334b3d" font-weight="400" text-anchor="start">Нет ресурса на O2 → рассмотреть O0.</text>
</g>
<text x="36" y="1679" font-size="25" fill="#334b3d" font-weight="400" text-anchor="start">Неизвестное ≠ факт и не доказанная невозможность.</text>
<text x="36" y="1718" font-size="24" fill="#334b3d" font-weight="400" text-anchor="start">Основания и краткие объяснения из сохранённых записей.</text>
<text x="36" y="1754" font-size="23" fill="#334b3d" font-weight="400" text-anchor="start">Не скрытые рассуждения модели и не доказательство спроса.</text>
</g></svg>
