name: Agent checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_required_procedures.py
      - run: python scripts/verify_demo.py
      - run: python scripts/verify_stress_demo.py
      - run: python scripts/verify_claims_demo.py
      - run: python scripts/verify_research_demo.py
      - run: python scripts/verify_follow_up_demo.py
      - run: python scripts/verify_feasibility_demo.py
      - run: python scripts/verify_branch_demo.py
      - run: python scripts/verify_material_changes_demo.py
      - run: python scripts/verify_resume_summary_demo.py
      - run: python scripts/verify_passport_demo.py
      - run: python scripts/verify_case_review_demo.py
      - run: python scripts/verify_required_procedures.py --case decision-passport-case
      - run: python scripts/verify_required_procedures.py --case research-branches-case
      - run: python scripts/verify_required_procedures.py --case feasibility-case
      - run: python scripts/verify_required_procedures.py --case decision-follow-up-case
      - run: python scripts/verify_required_procedures.py --case next-research-case
      - run: python scripts/verify_required_procedures.py --case marketing-claims-case
      - run: python scripts/verify_required_procedures.py --case decision-stress-case
      - run: python scripts/project_tool.py audit examples/campus-strategy/project.json --ready
      - run: python scripts/validate_project.py examples/activation-case/project.json
      - run: python scripts/start.py examples/campus-strategy/project.json --json
      - run: python scripts/verify_required_procedures.py --case review-contract-case
