name: Agent checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tools:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_demo.py
      - run: python scripts/verify_stress_demo.py
      - run: python scripts/verify_claims_demo.py
      - run: python scripts/project_tool.py audit examples/marketing-claims-case/project.json --ready --quality
      - run: python scripts/project_tool.py audit examples/decision-stress-case/project.json --ready --quality
      - run: python scripts/project_tool.py audit examples/campus-strategy/project.json --ready
      - run: python scripts/validate_project.py examples/activation-case/project.json
      - run: python scripts/start.py examples/campus-strategy/project.json --json
      - run: python scripts/project_tool.py audit examples/review-contract-case/project.json --ready --quality
